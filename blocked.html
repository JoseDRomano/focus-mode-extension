<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Focus time</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f4f4f2;
      color: #222;
      text-align: center;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { color: #666; }
    a { color: inherit; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1c1e; color: #eee; }
      p { color: #aaa; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Focus time</h1>
    <p id="message">This site is blocked during work hours.</p>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
